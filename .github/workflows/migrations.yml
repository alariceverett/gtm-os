# Database Migrations Workflow
# Runs migrations on push to main and on pull requests
# Uses Supabase CLI with repository secrets for credentials

name: Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - '.github/workflows/migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'migrations/**'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20'
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run migrations (dry-run on PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Running migration dry-run for PR..."
          supabase db push --dry-run
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run migrations (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Applying migrations to production..."
          supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run migrations (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🚀 Applying migrations to ${{ github.event.inputs.environment }}..."
          supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migrations applied
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "✅ Verifying migration status..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Migration failed! Check the logs above for details."
          echo "Migrations are idempotent - you can safely re-run this workflow."
