name: CI

on:
  push:
  pull_request:

jobs:
  gtm-command-center-baseline:
    name: gtm-command-center baseline checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend-shell
        working-directory: apps/gtm-command-center/frontend-shell
        run: npm ci && npm run build

      - name: Lint (placeholder)
        run: npm --prefix apps/gtm-command-center run ci:lint
