name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
        env:
          NODE_ENV: development
      
      - name: Install app dependencies
        working-directory: apps/gtm-command-center
        run: npm ci
        env:
          NODE_ENV: development
      
      - name: Run tests
        working-directory: apps/gtm-command-center
        run: npm run test
      
      - name: Run lint
        working-directory: apps/gtm-command-center
        run: npm run lint
      
      - name: Build verification
        working-directory: apps/gtm-command-center
        run: npm run build
