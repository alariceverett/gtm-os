name: CI

on:
  push:
  pull_request:

jobs:
  gtm-command-center-baseline:
    name: gtm-command-center baseline checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint (placeholder)
        run: npm --prefix apps/gtm-command-center run ci:lint

      - name: Node smoke checks
        run: npm --prefix apps/gtm-command-center run ci:smoke
