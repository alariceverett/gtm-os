name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
        working-directory: apps/gtm-command-center
      
      - name: Run lint
        run: npm run lint
        working-directory: apps/gtm-command-center
      
      - name: Build verification
        run: npm run build
        working-directory: apps/gtm-command-center
